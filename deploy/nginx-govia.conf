# /etc/nginx/sites-available/govia — exemplo com TLS (certificado institucional ou Let's Encrypt).
server {
    listen 80;
    server_name govia.exemplo.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name govia.exemplo.local;
    ssl_certificate     /etc/ssl/certs/govia.crt;
    ssl_certificate_key /etc/ssl/private/govia.key;
    client_max_body_size 11m;               # limite de upload (10 MB) + margem
    add_header X-Content-Type-Options nosniff always;

    location /static/ { alias /var/lib/govia/staticfiles/; expires 7d; }
    # Anexos NÃO são servidos pelo Nginx: PRIVATE_MEDIA_ROOT fica fora de qualquer location.
    location / {
        proxy_pass http://unix:/run/govia/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
