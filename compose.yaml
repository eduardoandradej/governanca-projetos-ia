# Opcional: PostgreSQL 16 para desenvolvimento. A aplicação roda fora do container.
# Uso: DB_PASSWORD=... docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-govia}
      POSTGRES_USER: ${DB_USER:-govia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [govia_pg:/var/lib/postgresql/data]
volumes:
  govia_pg:
